# Перевірки на кожен push і pull request: типи, лінтери й тести TypeScript і Rust.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    env:
      # prisma generate не підключається до БД, але конфіг читає змінну
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/onnimart
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Prisma Client
        working-directory: apps/api
        run: bun x prisma generate
      - name: Типи (пакети + API)
        run: bun run typecheck
      - name: Збірка API (nest build → dist, як для start:prod)
        working-directory: apps/api
        run: bun run build
      - name: Лінтер API
        working-directory: apps/api
        run: bun x eslint "{src,test,scripts,prisma}/**/*.ts"
      - name: Типи й лінтер web
        working-directory: apps/web
        # PageProps / LayoutProps генерує Next.js у .next/types
        run: bun x next typegen && bun x tsc --noEmit -p tsconfig.json && bun x eslint
      - name: Тести (matching, contracts, API)
        run: bun run test

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/scraper
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/scraper
      - run: cargo test --locked

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: onnimart_it
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/onnimart_it
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/onnimart_it
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Prisma Client і міграції
        working-directory: apps/api
        run: bun x prisma generate && bun x prisma migrate deploy
      - name: Інтеграційні й HTTP-тести (PostgreSQL, Redis)
        working-directory: apps/api
        run: bun run test:int
