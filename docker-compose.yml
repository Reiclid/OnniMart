# Фіксована назва: ті самі контейнери й томи з будь-якої копії репозиторію (worktree)
name: onnimart

services:
  postgres:
    image: postgres:16.15-alpine
    container_name: onnimart-postgres
    # Паралельні запити до повного каталогу не вміщаються в типові 64 МБ
    shm_size: 512mb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD у .env (див. .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-onnimart}
    # Лише з цього компʼютера: бази й черги не повинні бути видні в локальній мережі
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:8.10.2-alpine
    container_name: onnimart-redis
    restart: unless-stopped
    # Пароль обовʼязковий: без нього черги можна було б читати й підробляти
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Задайте REDIS_PASSWORD у .env (див. .env.example)}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  scraper:
    build: ./apps/scraper
    container_name: onnimart-scraper
    restart: unless-stopped
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # text — для людини, json — для збору логів (поля run_id, store)
      LOG_FORMAT: ${LOG_FORMAT:-text}
    depends_on:
      redis:
        condition: service_healthy

  meilisearch:
    image: getmeili/meilisearch:v1.54.3
    container_name: onnimart-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Задайте MEILI_MASTER_KEY у .env (див. .env.example)}
      MEILI_ENV: development
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meili_data:/meili_data

  # Разовий інструмент (не сервіс): магазини з OpenStreetMap, див. apps/api/scripts/osm-download.ts
  osm:
    build: ./tools/osm
    profiles: ["tools"]
    volumes:
      - ./data/osm:/data

volumes:
  postgres_data:
  redis_data:
  meili_data:
